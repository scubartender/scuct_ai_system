services:
  - type: web
    name: scuct-ai-linebot
    env: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TIMEOUT_SECONDS
        value: "45"
      - key: OPENAI_MAX_RETRIES
        value: "2"
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: REQUIRE_RUNTIME_CONFIG
        value: "true"
      - key: BUYER_TAX_ID
        value: "29902605"
      - key: HOURLY_KEEPALIVE_ENABLED
        value: "true"
      - key: HOURLY_KEEPALIVE_INTERVAL_MINUTES
        value: "10"
      - key: HOURLY_KEEPALIVE_URL
        value: "https://scuct-ai-linebot.onrender.com"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LIFF_ID
        sync: false
